name: build-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tag pushes

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Inlined into the JS bundle at build time. Set it under
      # Settings > Secrets and variables > Actions > Variables.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check API URL is set
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Repo variable EXPO_PUBLIC_API_URL is not set"; exit 1
          fi

      - run: npm ci

      # /android is git-ignored, so generate the native project from app.json
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk cus-shift-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cus-shift-apk
          path: cus-shift-*.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cus-shift-*.apk
